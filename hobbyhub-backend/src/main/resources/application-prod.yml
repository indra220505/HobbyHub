spring:
  datasource:
    url: ${DATABASE_URL}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true

server:
  port: ${PORT:8080}

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: 86400000
  refresh-expiration-ms: 604800000

cloud:
  aws:
    credentials:
      access-key: ${S3_ACCESS_KEY:none}
      secret-key: ${S3_SECRET_KEY:none}
    region:
      static: ${S3_REGION:us-east-1}
    s3:
      endpoint: ${S3_ENDPOINT:none}
      bucket-name: ${S3_BUCKET_NAME:hobbyhub-media}
