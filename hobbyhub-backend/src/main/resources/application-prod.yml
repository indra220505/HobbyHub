spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:hobbyhub}?sslmode=require}
    username: ${SPRING_DATASOURCE_USERNAME:${PGUSER:postgres}}
    password: ${SPRING_DATASOURCE_PASSWORD:${PGPASSWORD:postgres}}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      connection-timeout: 60000       # Tunggu hingga 60 detik jika Neon sedang cold start
      max-lifetime: 1800000           # 30 menit (standar AWS/Cloud)
      idle-timeout: 600000            # 10 menit
      leak-detection-threshold: 30000 # Mendeteksi jika koneksi nyangkut lebih dari 30s
      initialization-fail-timeout: 0  # Aplikasi tetap hidup biarpun DB belum 100% siap saat boot
      validation-timeout: 5000        # Validasi koneksi aktif (5s)

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true
    connect-retries: 10               # Retry maksimal 10x jika koneksi DB gagal
    connect-retries-interval: 5       # Jeda retry 5 detik (total = 50 detik nunggu DB bangun)

  mail:
    host: ${SPRING_MAIL_HOST:smtp.gmail.com}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:hobbyhub.auth@gmail.com}
    password: ${SPRING_MAIL_PASSWORD:none}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: ${SPRING_MAIL_STARTTLS_ENABLE:true}
            required: ${SPRING_MAIL_STARTTLS_REQUIRED:true}
          ssl:
            enable: ${SPRING_MAIL_SSL_ENABLE:false}
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000


server:
  port: ${PORT:8080}

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: 86400000
  refresh-expiration-ms: 604800000

cloud:
  aws:
    credentials:
      access-key: ${S3_ACCESS_KEY:none}
      secret-key: ${S3_SECRET_KEY:none}
    region:
      static: ${S3_REGION:us-east-1}
    s3:
      endpoint: ${S3_ENDPOINT:none}
      bucket-name: ${S3_BUCKET_NAME:hobbyhub-media}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized

logging:
  level:
    root: INFO
    org.springframework.web: ERROR
    org.hibernate.SQL: ERROR
    com.zaxxer.hikari: INFO
